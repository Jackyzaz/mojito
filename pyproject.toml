[project]
name = "mojito"
version = "0.1.0"
description = "Hat Yai flood prediction - ML models and data notebooks"
requires-python = ">=3.13"
dependencies = [
    "flask>=3.1.3",
    "folium>=0.20.0",
    "geopandas>=1.2.0",
    "h3>=4.5.0",
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.4",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "nbformat>=5.11.1",
    "pandas>=3.0.6",
    "pdfplumber>=0.11.10",
    "plotly>=7.1.0",
    "pyarrow>=25.0.1",
    "pysheds>=0.5",
    "pystac-client>=0.9.0",
    "requests>=2.34.2",
    "requests-cache>=1.3.3",
    "rioxarray>=0.23.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "shapely>=2.1.2",
    "torch>=2.14.1",
    "tqdm>=4.70.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
mojito-web = "mojito.web:main"

# CPU-only PyTorch: the machine has no GPU and the CUDA wheels are several GB
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
